<style>
  :root{
    --bg:#f4f4f5;
    --panel:#fafafa;
    --panel-2:#ececee;
    --line:#dcdce0;
    --text:#1f1f22;
    --muted:#6e6e73;
    --faint:#a0a0a5;
    --accent:#3a3a3d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:row;
    height:100vh;
    overflow:hidden;
  }
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* Editor */
  .editor-wrap{
    flex:1;
    display:flex;
    min-height:0;
    padding:16px;
  }
  textarea{
    flex:1;
    width:100%;
    resize:none;
    border:none;
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    font-family:'Lora',Georgia,'Times New Roman',serif;
    font-size:20px;
    line-height:1.6;
    padding:22px 24px;
    outline:none;
  }
  textarea::placeholder{color:var(--faint);}

  /* Status bar */
  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 18px;
    border-top:1px solid var(--line);
    background:var(--panel);
    font-size:12px;
    color:var(--muted);
  }
  .mode{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    letter-spacing:.3px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--faint);
    transition:background .15s ease;
  }
  body.cyr .dot{background:#9ad29a;}
  #escBtn, #help kbd{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:5px;
    padding:1px 6px;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:400;
    color:var(--text);
  }
  #escBtn{
    cursor:pointer;
    transition:background .15s ease;
  }
  #escBtn:hover{background:var(--line);}
  #escBtn:active{border-bottom-width:1px;margin-top:1px;}
  #helpBtn{
    border:none;
    background:none;
    padding:0;
    font:inherit;
    color:var(--muted);
    cursor:pointer;
    text-underline-offset:3px;
    transition:color .15s ease;
  }
  #helpBtn:hover{color:var(--text);text-decoration:underline;}
  .status-right{
    display:inline-flex;
    align-items:center;
    gap:14px;
  }
  #langBtn{
    border:none;
    background:var(--text);
    color:#fff;
    border-radius:4px;
    padding:2px 5px;
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:600;
    line-height:1.3;
    letter-spacing:.5px;
    cursor:pointer;
    transition:background .15s ease;
  }
  #langBtn:hover{background:var(--accent);}

  /* Help dialog */
  #help{
    border:none;
    padding:0;
    border-radius:14px;
    background:var(--panel);
    color:var(--text);
    width:min(560px, calc(100vw - 32px));
    max-height:calc(100vh - 48px);
    overflow:auto;
    box-shadow:0 24px 64px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06);
  }
  #help::backdrop{background:rgba(20,20,22,.28);}
  #help[open]{animation:help-in .16s ease-out;}
  #help[open]::backdrop{animation:help-fade .16s ease-out;}
  @keyframes help-in{from{opacity:0;transform:translateY(6px) scale(.98);}}
  @keyframes help-fade{from{opacity:0;}}
  .help-inner{padding:20px 24px 18px;}
  .help-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .help-head h2{
    margin:0;
    font-size:15px;
    font-weight:600;
    outline:none;
  }
  #helpClose{
    border:none;
    background:transparent;
    color:var(--faint);
    cursor:pointer;
    padding:4px;
    margin-right:-6px;
    border-radius:6px;
    display:flex;
    transition:background .12s ease, color .12s ease;
  }
  #helpClose:hover{background:var(--line);color:var(--text);}
  #helpClose svg{display:block;width:18px;height:18px;}
  .help-lead{
    margin:0 0 16px;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .help-grid{
    column-count:3;
    column-gap:28px;
  }
  .help-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 0;
    border-bottom:1px solid var(--panel-2);
    break-inside:avoid;
  }
  .help-cyr{
    width:28px;
    height:28px;
    margin-left:-4px;
    padding:0;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text);
    font-family:'Lora',Georgia,serif;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    transition:background .12s ease;
  }
  .help-cyr:hover{background:var(--panel-2);}
  #help.caps .help-cyr{text-transform:uppercase;}
  .help-lat{display:flex;flex-wrap:wrap;gap:4px;}
  .help-tips{
    display:flex;
    flex-wrap:wrap;
    gap:6px 20px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
  }
  @media (max-width:520px){
    .help-grid{column-count:2;}
  }

  /* Notes sidebar */
  .sidebar{
    width:20%;
    min-width:200px;
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--line);
    background:var(--bg);
  }
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-head h2{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);
  }
  #newNote{
    border:none;
    background:var(--panel-2);
    color:var(--text);
    width:26px;height:26px;
    border-radius:7px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  #newNote:hover{background:var(--line);}
  .note-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
  }
  .note-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:2px;
    transition:background .12s ease;
  }
  .note-item:hover{background:var(--panel-2);}
  .note-item.active{background:var(--panel-2);}
  .note-body{flex:1;min-width:0;}
  .note-del{
    flex-shrink:0;
    align-self:center;
    border:none;
    background:transparent;
    color:var(--faint);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    opacity:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .note-item:hover .note-del{opacity:1;}
  .note-del:hover{background:var(--line);color:var(--text);}
  .note-del svg{display:block;width:20px;height:20px;}
  .note-title{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--text);
  }
  .note-date{
    font-size:11px;
    color:var(--faint);
    margin:2px 0;
  }
  .note-snippet{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-empty{
    padding:16px 12px;
    font-size:12px;
    color:var(--faint);
    text-align:center;
  }
</style>
</head>
<body class="cyr">
  <div class="main">
    <div class="editor-wrap">
      <textarea id="ta" autofocus spellcheck="false"></textarea>
    </div>

    <div class="status">
      <span class="mode">
        <span class="dot"></span><span id="modeLabel">Cyrillic</span>
        <button id="escBtn" type="button" title="Toggle Cyrillic / Latin (Esc)">Esc</button>
      </span>
      <span class="status-right">
        <button id="langBtn" type="button" title="Switch language (RU / UA)">RU</button>
        <button id="helpBtn" type="button">Help</button>
      </span>
    </div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>Notes</h2>
      <button id="newNote" title="New note">+</button>
    </div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <dialog id="help" aria-labelledby="helpTitle">
    <div class="help-inner">
      <div class="help-head">
        <h2 id="helpTitle" tabindex="-1" autofocus>Transliteration</h2>
        <button id="helpClose" type="button" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="help-lead">Type Latin letters and they turn into Cyrillic as you go. Capitals work too: <kbd>Zh</kbd> → Ж. Click a letter to insert it, hold <kbd>Shift</kbd> for a capital.</p>
      <div class="help-grid" id="helpGrid"></div>
      <div class="help-tips">
        <span><kbd>Esc</kbd> switch Cyrillic / Latin</span>
        <span>Select text to copy it</span>
        <span>Double-click to copy all</span>
      </div>
    </div>
  </dialog>

<script>
  // [latin label, input alternatives, cyrillic]
  const LAYOUTS = {
    ru: [
      ['A','a','а'],['B','b','б'],['V','v','в'],['G','g','г'],['D','d','д'],['E','e','е'],
      ['Jo','jo,yo,ö','ё'],['Zh','zh','ж'],['Z','z','з'],['I','i','и'],['J','j','й'],
      ['K','k','к'],['L','l','л'],['M','m','м'],['N','n','н'],['O','o','о'],['P','p','п'],
      ['R','r','р'],['S','s','с'],['T','t','т'],['U','u','у'],['F','f','ф'],['H','h,x','х'],
      ['C','c','ц'],['Ch','ch','ч'],['Sh','sh','ш'],['Shh','shh,w','щ'],['##','#,tvz','ъ'],
      ['Y','y','ы'],['"',"',mjz",'ь'],['Je','je,ä','э'],['Ju','ju,yu,ü','ю'],['Ja','ja,ya,q','я']
    ],
    ua: [
      ['A','a','а'],['B','b','б'],['V','v','в'],['G','g','г'],["G'","g'",'ґ'],['D','d','д'],
      ['E','e','е'],['Je','je,ye,ö','є'],['Zh','zh','ж'],['Z','z','з'],['Y','y','и'],['I','i','і'],
      ["I'","i',ji",'ї'],['J','j','й'],['K','k','к'],['L','l','л'],['M','m','м'],['N','n','н'],
      ['O','o','о'],['P','p','п'],['R','r','р'],['S','s','с'],['T','t','т'],['U','u','у'],
      ['F','f','ф'],['H','h,x','х'],['C','c','ц'],['Ch','ch','ч'],['Sh','sh,w','ш'],
      ['Shh','shh,q','щ'],['"',"'",'ь'],['`','`','’'],['Ju','ju,yu,ü','ю'],['Ja','ja,ya','я']
    ]
  };
  const LANG_STORE = 'translit-lang';
  let lang = 'ru';
  try{
    const saved = localStorage.getItem(LANG_STORE);
    if (Object.hasOwn(LAYOUTS, saved)) lang = saved;
  }catch(_){}

  // Build translit map for the active layout (rebuilt on language switch)
  let KEYS, MAP, SEQ;
  function buildMap(){
    KEYS = LAYOUTS[lang];
    MAP = {};
    for (const [, alts, cyr] of KEYS){
      for (const seq of alts.split(',')) MAP[seq] = cyr;
    }
    // Longest sequences first for greedy matching
    SEQ = Object.keys(MAP).sort((a,b) => b.length - a.length);
  }
  buildMap();
  const isUpper = c => c !== c.toLowerCase() && c === c.toUpperCase();

  const LETTER = /^[A-Za-z#'`äöüÄÖÜ]$/;

  // Greedy transliteration of a short string (used to preview the volatile run).
  function translit(text){
    let out = '', i = 0;
    while (i < text.length){
      const low = text.slice(i).toLowerCase();
      let k = null;
      for (const key of SEQ){ if (low.startsWith(key)){ k = key; break; } }
      if (k){
        let c = MAP[k];
        if (isUpper(text[i])) c = c.toUpperCase();
        out += c; i += k.length;
      } else { out += text[i]; i++; }
    }
    return out;
  }
  // Could `s` still grow into a longer sequence?
  function canExtend(s){
    const low = s.toLowerCase();
    return SEQ.some(k => k.length > low.length && k.startsWith(low));
  }

  // Editor — the textarea holds the real, final characters. Only the few latin
  // letters currently being typed live in `vol` (a volatile run shown
  // transliterated); once they can't grow into a longer sequence they're baked
  // into the document as real characters and forgotten. Everything else —
  // caret, selection, delete, undo — is native.
  const ta = document.getElementById('ta');
  const modeLabel = document.getElementById('modeLabel');
  let cyrMode = true;
  let vol = '';          // latin letters of the in-progress run
  let volStart = 0;      // where the run begins in the textarea
  let volOut = '';       // its current rendered form (what's shown)

  function flushVol(){ vol = ''; volOut = ''; }   // settle the run as-is

  ta.addEventListener('beforeinput', e => {
    const s = ta.selectionStart, en = ta.selectionEnd;
    // If the caret left the run (click/arrow) or there's a selection, settle it.
    if (vol && (s !== en || s !== volStart + volOut.length)) flushVol();

    // Only single latin letters in Cyrillic mode feed the run; everything else
    // (delete, space, punctuation, paste, Latin mode) is handled natively.
    if (!(cyrMode && e.inputType === 'insertText' && e.data && LETTER.test(e.data))){
      flushVol();
      return;
    }
    e.preventDefault();
    if (en !== s) ta.setRangeText('', s, en, 'end');   // replace selection
    if (!vol) volStart = ta.selectionStart;

    vol += e.data;
    // Bake any leading part that can no longer grow; keep the rest volatile.
    let commit = '';
    while (vol && !canExtend(vol)){
      const low = vol.toLowerCase();
      let k = null;
      for (const key of SEQ){ if (low.startsWith(key)){ k = key; break; } }
      if (k){
        let c = MAP[k];
        if (isUpper(vol[0])) c = c.toUpperCase();
        commit += c; vol = vol.slice(k.length);
      } else { commit += vol[0]; vol = vol.slice(1); }
    }
    const newOut = translit(vol);
    ta.setRangeText(commit + newOut, volStart, volStart + volOut.length, 'end');
    volStart += commit.length;
    volOut = newOut;
    persistCurrent();   // setRangeText doesn't fire `input`, so save explicitly
  });

  // Auto-copy whatever is selected.
  let lastCopied = '';
  function copySelection(){
    const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    if (!sel || sel === lastCopied) return;
    lastCopied = sel;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(sel).then(flashCopied).catch(execCopy);
    } else {
      execCopy();
    }
  }
  function execCopy(){
    try { if (document.execCommand('copy')) flashCopied(); } catch (_){}
  }
  function flashCopied(){
    modeLabel.dataset.prev = modeLabel.dataset.prev || modeLabel.textContent;
    modeLabel.textContent = 'Copied';
    clearTimeout(flashCopied._t);
    flashCopied._t = setTimeout(() => {
      modeLabel.textContent = modeLabel.dataset.prev;
      delete modeLabel.dataset.prev;
    }, 900);
  }
  document.addEventListener('selectionchange', () => {
    if (document.activeElement === ta) copySelection();
  });

  // Double-click selects all and copies.
  ta.addEventListener('dblclick', e => {
    e.preventDefault();
    ta.select();
    copySelection();
  });

  function setMode(on){
    flushVol();                         // settle any in-progress run
    cyrMode = on;                       // only affects text typed from now on
    document.body.classList.toggle('cyr', on);
    modeLabel.textContent = on ? 'Cyrillic' : 'Latin';
    ta.focus();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      e.preventDefault();
      if (help.open) help.close();      // Esc closes help instead of toggling
      else setMode(!cyrMode);
    }
  });

  const escBtn = document.getElementById('escBtn');
  escBtn.addEventListener('mousedown', e => e.preventDefault());   // keep caret in the textarea
  escBtn.addEventListener('click', () => setMode(!cyrMode));

  // Help dialog — the table is built from KEYS so it always matches the map.
  const help = document.getElementById('help');
  const helpGrid = document.getElementById('helpGrid');
  function renderHelp(){
    document.getElementById('helpTitle').textContent =
      (lang === 'ru' ? 'Russian' : 'Ukrainian') + ' transliteration';
    helpGrid.innerHTML = KEYS.map(([, alts, cyr]) =>
      '<div class="help-row"><button type="button" class="help-cyr">' + cyr + '</button><span class="help-lat">' +
      alts.split(',').map(a => '<kbd>' + a + '</kbd>').join('') + '</span></div>'
    ).join('');
  }
  document.getElementById('helpBtn').addEventListener('click', () => help.showModal());
  document.getElementById('helpClose').addEventListener('click', () => help.close());
  help.addEventListener('click', e => { if (e.target === help) help.close(); });   // backdrop
  help.addEventListener('close', () => ta.focus());

  // Clicking a letter inserts it at the caret; Shift inserts the capital.
  helpGrid.addEventListener('mousedown', e => { if (e.target.closest('.help-cyr')) e.preventDefault(); });
  helpGrid.addEventListener('click', e => {
    const b = e.target.closest('.help-cyr');
    if (!b) return;
    const c = e.shiftKey ? b.textContent.toUpperCase() : b.textContent;
    help.close();
    flushVol();
    ta.focus();
    ta.setRangeText(c, ta.selectionStart, ta.selectionEnd, 'end');
    persistCurrent();
  });
  // While Shift is held the table shows capitals.
  const setCaps = on => help.classList.toggle('caps', on);
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setCaps(true); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setCaps(false); });
  window.addEventListener('blur', () => setCaps(false));

  // Language — RU / UA layout; the choice is remembered.
  const langBtn = document.getElementById('langBtn');
  function setLang(l){
    flushVol();                         // settle any run typed under the old layout
    lang = l;
    buildMap();
    langBtn.textContent = l.toUpperCase();
    renderHelp();
    try{ localStorage.setItem(LANG_STORE, l); }catch(_){}
  }
  langBtn.addEventListener('mousedown', e => e.preventDefault());   // keep caret in the textarea
  langBtn.addEventListener('click', () => setLang(lang === 'ru' ? 'ua' : 'ru'));
  setLang(lang);

  // Notes — persisted to localStorage as JSON.
  const STORE = 'translit-notes';
  const noteListEl = document.getElementById('noteList');
  let notes = [];
  let currentId = null;

  const blankNote = () => ({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    body: '',
    updated: Date.now()
  });
  const current = () => notes.find(n => n.id === currentId);

  function loadNotes(){
    try{
      const data = JSON.parse(localStorage.getItem(STORE));
      if (data && Array.isArray(data.notes)){ notes = data.notes; currentId = data.currentId; }
    }catch(_){}
    if (!notes.length){ const n = blankNote(); notes.push(n); currentId = n.id; }
    if (!notes.some(n => n.id === currentId)) currentId = notes[0].id;
  }
  function saveNotes(){
    localStorage.setItem(STORE, JSON.stringify({ notes, currentId }));
  }

  function previewOf(body){
    const t = body.replace(/^\s+/, '');
    const nl = t.indexOf('\n');
    const title = (nl === -1 ? t : t.slice(0, nl)).trim() || 'New Note';
    const rest = (nl === -1 ? '' : t.slice(nl + 1)).replace(/\s+/g, ' ').trim();
    return { title, snippet: rest || 'No additional text' };
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function renderList(){
    noteListEl.innerHTML = '';
    [...notes].sort((a, b) => b.updated - a.updated).forEach(n => {
      const { title, snippet } = previewOf(n.body);
      const item = document.createElement('div');
      item.className = 'note-item' + (n.id === currentId ? ' active' : '');
      item.innerHTML =
        '<div class="note-body">' +
          '<div class="note-title"></div><div class="note-date"></div><div class="note-snippet"></div>' +
        '</div>' +
        '<button class="note-del" title="Delete note" aria-label="Delete note">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="3 6 5 6 21 6"></polyline>' +
            '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>' +
            '<path d="M10 11v6M14 11v6"></path>' +
            '<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>' +
          '</svg>' +
        '</button>';
      item.querySelector('.note-title').textContent = title;
      item.querySelector('.note-date').textContent = fmtDate(n.updated);
      item.querySelector('.note-snippet').textContent = snippet;
      item.querySelector('.note-body').addEventListener('click', () => selectNote(n.id));
      item.querySelector('.note-del').addEventListener('click', e => {
        e.stopPropagation();
        deleteNote(n.id);
      });
      noteListEl.appendChild(item);
    });
  }

  function selectNote(id){
    if (id === currentId) return;
    flushVol();
    currentId = id;
    ta.value = current().body;
    saveNotes();
    renderList();
    ta.focus();
  }
  function newNote(){
    flushVol();
    const n = blankNote();
    notes.push(n);
    currentId = n.id;
    ta.value = '';
    saveNotes();
    renderList();
    ta.focus();
  }
  function deleteNote(id){
    flushVol();
    notes = notes.filter(n => n.id !== id);
    if (!notes.length){ const n = blankNote(); notes.push(n); currentId = n.id; }
    if (!notes.some(n => n.id === currentId)){
      currentId = [...notes].sort((a, b) => b.updated - a.updated)[0].id;
    }
    ta.value = current().body;
    saveNotes();
    renderList();
    ta.focus();
  }
  document.getElementById('newNote').addEventListener('click', newNote);

  // Write the textarea's current contents into the active note and persist.
  function persistCurrent(){
    const n = current();
    if (!n) return;
    n.body = ta.value;
    n.updated = Date.now();
    saveNotes();
    renderList();
  }
  // Native edits (space, punctuation, delete, paste) fire `input`. Transliterated
  // letters go through setRangeText in `beforeinput`, which does NOT fire `input`,
  // so those are persisted explicitly there via persistCurrent().
  ta.addEventListener('input', persistCurrent);

  loadNotes();
  ta.value = current().body;
  renderList();
  ta.focus();
</script>
</body>
</html>

<style>
  :root{
    --bg:#f4f4f5;
    --panel:#fafafa;
    --panel-2:#ececee;
    --line:#dcdce0;
    --text:#1f1f22;
    --muted:#6e6e73;
    --faint:#a0a0a5;
    --accent:#3a3a3d;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#161618;
    --panel:#1e1e21;
    --panel-2:#2a2a2e;
    --line:#323236;
    --text:#e6e6e8;
    --muted:#9a9aa0;
    --faint:#66666c;
    --accent:#c4c4c8;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:row;
    height:100vh;
    overflow:hidden;
  }
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* Editor */
  .editor-wrap{
    flex:1;
    display:flex;
    min-height:0;
    padding:16px;
  }
  textarea{
    flex:1;
    width:100%;
    resize:none;
    border:none;
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    font-family:'Lora',Georgia,'Times New Roman',serif;
    font-size:20px;
    line-height:1.6;
    padding:22px 24px;
    outline:none;
  }
  textarea::placeholder{color:var(--faint);}

  /* Status bar */
  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 18px;
    border-top:1px solid var(--line);
    background:var(--panel);
    font-size:12px;
    color:var(--muted);
  }
  .mode{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    letter-spacing:.3px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--faint);
    transition:background .15s ease;
  }
  body.cyr .dot{background:#9ad29a;}
  #escBtn, #help kbd{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-bottom-width:2px;
    border-radius:5px;
    padding:1px 6px;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:400;
    color:var(--text);
  }
  #escBtn{
    cursor:pointer;
    transition:background .15s ease;
  }
  #escBtn:hover{background:var(--line);}
  #escBtn:active{border-bottom-width:1px;margin-top:1px;}
  .icon-btn{
    border:none;
    background:none;
    padding:0;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    transition:color .15s ease;
  }
  .icon-btn:hover{color:var(--text);}
  .icon-btn svg{display:block;width:16px;height:16px;}
  /* The theme button shows the theme it switches to */
  :root[data-theme="dark"] #themeBtn .moon,
  :root:not([data-theme="dark"]) #themeBtn .sun{display:none;}
  .status-right{
    display:inline-flex;
    align-items:center;
    gap:14px;
  }
  #langBtn, .lang-code{
    background:var(--text);
    color:var(--panel);
    border-radius:4px;
    padding:2px 5px;
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:600;
    line-height:1.3;
    letter-spacing:.5px;
  }
  #langBtn{
    border:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  #langBtn:hover{background:var(--accent);}

  /* Dialogs */
  dialog{
    border:none;
    padding:0;
    border-radius:14px;
    background:var(--panel);
    color:var(--text);
    max-height:calc(100vh - 48px);
    overflow:auto;
    box-shadow:0 24px 64px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06);
  }
  dialog::backdrop{background:rgba(20,20,22,.28);}
  :root[data-theme="dark"] dialog::backdrop{background:rgba(0,0,0,.5);}
  dialog[open]{animation:dlg-in .16s ease-out;}
  dialog[open]::backdrop{animation:fade-in .16s ease-out;}
  @keyframes dlg-in{from{opacity:0;transform:translateY(6px) scale(.98);}}
  @keyframes fade-in{from{opacity:0;}}
  .dlg-inner{padding:20px 24px 18px;}
  .dlg-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .dlg-head h2{
    margin:0;
    font-size:15px;
    font-weight:600;
    outline:none;
  }
  .dlg-close{
    border:none;
    background:transparent;
    color:var(--faint);
    cursor:pointer;
    padding:4px;
    margin-right:-6px;
    border-radius:6px;
    display:flex;
    transition:background .12s ease, color .12s ease;
  }
  .dlg-close:hover{background:var(--line);color:var(--text);}
  .dlg-close svg{display:block;width:18px;height:18px;}

  /* Language dialog */
  #langDlg{width:min(320px, calc(100vw - 32px));}
  .lang-list{margin:10px -12px 0;}
  .lang-opt{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:9px 12px;
    margin-bottom:2px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    text-align:left;
    cursor:pointer;
    transition:background .12s ease;
  }
  .lang-opt:hover, .lang-opt[aria-current="true"]{background:var(--panel-2);}
  .lang-code{min-width:26px;text-align:center;}
  .lang-opt svg{width:16px;height:16px;margin-left:auto;color:var(--muted);}

  /* Help dialog */
  #help{width:min(560px, calc(100vw - 32px));}
  .help-lead{
    margin:0 0 16px;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .help-grid{
    column-count:3;
    column-gap:28px;
  }
  .help-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 0;
    border-bottom:1px solid var(--panel-2);
    break-inside:avoid;
  }
  .help-cyr{
    width:28px;
    height:28px;
    margin-left:-4px;
    padding:0;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text);
    font-family:'Lora',Georgia,serif;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    transition:background .12s ease;
  }
  .help-cyr:hover{background:var(--panel-2);}
  #help.caps .help-cyr{text-transform:uppercase;}
  .help-lat{display:flex;flex-wrap:wrap;gap:4px;}
  .help-tips{
    display:flex;
    flex-wrap:wrap;
    gap:6px 20px;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
  }
  @media (max-width:520px){
    .help-grid{column-count:2;}
  }

  /* Context menu */
  #ctxMenu{
    position:fixed;
    z-index:10;
    min-width:160px;
    padding:4px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel);
    box-shadow:0 12px 32px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.06);
    animation:fade-in .1s ease-out;
  }
  #ctxMenu button{
    display:block;
    width:100%;
    border:none;
    border-radius:6px;
    background:transparent;
    color:var(--text);
    padding:6px 10px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    text-align:left;
    cursor:pointer;
  }
  #ctxMenu button:hover:not(:disabled){background:var(--panel-2);}
  #ctxMenu button:disabled{color:var(--faint);cursor:default;}
  .ctx-sep{height:1px;margin:4px 6px;background:var(--line);}

  /* Notes sidebar */
  .sidebar{
    width:20%;
    min-width:200px;
    display:flex;
    flex-direction:column;
    border-left:1px solid var(--line);
    background:var(--bg);
  }
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-head h2{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--muted);
  }
  #newNote{
    border:none;
    background:var(--panel-2);
    color:var(--text);
    width:26px;height:26px;
    border-radius:7px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  #newNote:hover{background:var(--line);}
  .note-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
  }
  .note-item{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:2px;
    transition:background .12s ease;
  }
  .note-item:hover{background:var(--panel-2);}
  .note-item.active{background:var(--panel-2);}
  .note-body{flex:1;min-width:0;}
  .note-del{
    flex-shrink:0;
    align-self:center;
    border:none;
    background:transparent;
    color:var(--faint);
    cursor:pointer;
    padding:4px;
    border-radius:6px;
    opacity:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .note-item:hover .note-del{opacity:1;}
  .note-del:hover{background:var(--line);color:var(--text);}
  .note-del svg{display:block;width:20px;height:20px;}
  .note-title{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--text);
  }
  .note-date{
    font-size:11px;
    color:var(--faint);
    margin:2px 0;
  }
  .note-snippet{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-empty{
    padding:16px 12px;
    font-size:12px;
    color:var(--faint);
    text-align:center;
  }
</style>
<script>
  // Set the theme before first paint: the saved choice, else the system setting.
  document.documentElement.dataset.theme = (() => {
    try{ return localStorage.getItem('translit-theme'); }catch(_){}
  })() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>

      copy: 'Копіювати', toCyr: 'На кирилицю', toLat: 'На латиницю',
      notes: 'Нотатки', newNote: 'Нова нотатка', noText: 'Немає додаткового тексту',
      deleteNote: 'Видалити нотатку'
    },
    by: {
      name: 'Беларуская', htmlLang: 'be',
      on: 'Укл.', off: 'Выкл.', copied: 'Скапіявана',
      toggle: 'Уключыць / выключыць трансліт (Esc)',
      language: 'Мова', help: 'Даведка', close: 'Закрыць', darkTheme: 'Цёмная тэма',
      helpTitle: 'Транслітарацыя',
      helpLead: 'Пішыце лацініцай — літары адразу ператвараюцца ў кірыліцу. Вялікія таксама працуюць: <kbd>Zh</kbd> → Ж. Націсніце на літару, каб уставіць яе, з <kbd>Shift</kbd> — вялікую.',
      tipEsc: '<kbd>Esc</kbd> уключыць / выключыць трансліт',
      tipMenu: 'Правы клік: капіяваць або пераўтварыць вылучаны тэкст ці ўсю нататку',
      copy: 'Капіяваць', toCyr: 'У кірыліцу', toLat: 'У лацініцу',
      notes: 'Нататкі', newNote: 'Новая нататка', noText: 'Няма дадатковага тэксту',
      deleteNote: 'Выдаліць нататку'
    },
    bg: {
      name: 'Български', htmlLang: 'bg',
      on: 'Вкл.', off: 'Изкл.', copied: 'Копирано',
      toggle: 'Включване / изключване на транслитерацията (Esc)',
      language: 'Език', help: 'Помощ', close: 'Затвори', darkTheme: 'Тъмна тема',
      helpTitle: 'Транслитерация',
      helpLead: 'Пишете на латиница — буквите веднага се превръщат в кирилица. Главните също работят: <kbd>Zh</kbd> → Ж. Щракнете върху буква, за да я вмъкнете, а с <kbd>Shift</kbd> — главна.',
      tipEsc: '<kbd>Esc</kbd> включване / изключване на транслитерацията',
      tipMenu: 'Десен бутон: копиране или преобразуване на избрания текст или на цялата бележка',
      copy: 'Копиране', toCyr: 'Към кирилица', toLat: 'Към латиница',
      notes: 'Бележки', newNote: 'Нова бележка', noText: 'Няма допълнителен текст',
      deleteNote: 'Изтриване на бележката'
    }
  };

  // ?lang=ua picks the language, else the last choice, else Russian.
  const LANG_STORE = 'translit-lang';
  const isLang = l => Object.hasOwn(LAYOUTS, l);
  const urlLang = () => new URLSearchParams(location.search).get('lang')?.toLowerCase();
  let lang = urlLang();
  if (!isLang(lang)){
    lang = 'ru';
    try{
      const saved = localStorage.getItem(LANG_STORE);
      if (isLang(saved)) lang = saved;
    }catch(_){}
  }
  let T = I18N[lang];

  // Build translit map for the active layout (rebuilt on language switch)
  let KEYS, MAP, SEQ, REV;
  function buildMap(){
    KEYS = LAYOUTS[lang];
    MAP = {};
    REV = {};
    for (const [, alts, cyr] of KEYS){
      for (const seq of alts.split(',')) MAP[seq] = cyr;
      REV[cyr] = alts.split(',')[0];    // To Latin uses the primary spelling
    }
    // Longest sequences first for greedy matching
    SEQ = Object.keys(MAP).sort((a,b) => b.length - a.length);
  }
  buildMap();
  const isUpper = c => c !== c.toLowerCase() && c === c.toUpperCase();

  const LETTER = /^[A-Za-z#'`äöüÄÖÜ]$/;

  // Greedy transliteration of a short string (used to preview the volatile run).
  function translit(text){
    let out = '', i = 0;
    while (i < text.length){
      const low = text.slice(i).toLowerCase();
      let k = null;
      for (const key of SEQ){ if (low.startsWith(key)){ k = key; break; } }
      if (k){
        let c = MAP[k];
        if (isUpper(text[i])) c = c.toUpperCase();
        out += c; i += k.length;
      } else { out += text[i]; i++; }
    }
    return out;
  }
  // Cyrillic back to Latin. Runs of capitals stay all-caps: Жук → Zhuk, ЖУК → ZHUK.
  function toLatin(text){
    let out = '';
    for (let i = 0; i < text.length; i++){
      const c = text[i], lat = REV[c.toLowerCase()];
      if (lat === undefined){ out += c; continue; }
      if (!isUpper(c)) out += lat;
      else if (isUpper(text[i-1] || '') || isUpper(text[i+1] || '')) out += lat.toUpperCase();
      else out += lat[0].toUpperCase() + lat.slice(1);
    }
    return out;
  }
  // Could `s` still grow into a longer sequence?
  function canExtend(s){
    const low = s.toLowerCase();
    return SEQ.some(k => k.length > low.length && k.startsWith(low));
  }

  // Editor — the textarea holds the real, final characters. Only the few latin
  // letters currently being typed live in `vol` (a volatile run shown
  // transliterated); once they can't grow into a longer sequence they're baked
  // into the document as real characters and forgotten. Everything else —
  // caret, selection, delete, undo — is native.
  const ta = document.getElementById('ta');
  const modeLabel = document.getElementById('modeLabel');
  let cyrMode = true;
  let vol = '';          // latin letters of the in-progress run
  let volStart = 0;      // where the run begins in the textarea
  let volOut = '';       // its current rendered form (what's shown)
  let replacing = false; // a context-menu conversion is being inserted

  function flushVol(){ vol = ''; volOut = ''; }   // settle the run as-is

  ta.addEventListener('beforeinput', e => {
    if (replacing) return;              // menu conversion — insert as-is
    const s = ta.selectionStart, en = ta.selectionEnd;
    // If the caret left the run (click/arrow) or there's a selection, settle it.
    if (vol && (s !== en || s !== volStart + volOut.length)) flushVol();

    // Only single latin letters in Cyrillic mode feed the run; everything else
    // (delete, space, punctuation, paste, Latin mode) is handled natively.
    if (!(cyrMode && e.inputType === 'insertText' && e.data && LETTER.test(e.data))){
      flushVol();
      return;
    }
    e.preventDefault();
    if (en !== s) ta.setRangeText('', s, en, 'end');   // replace selection
    if (!vol) volStart = ta.selectionStart;

    vol += e.data;
    // Bake any leading part that can no longer grow; keep the rest volatile.
    let commit = '';
    while (vol && !canExtend(vol)){
      const low = vol.toLowerCase();
      let k = null;
      for (const key of SEQ){ if (low.startsWith(key)){ k = key; break; } }
      if (k){
        let c = MAP[k];
        if (isUpper(vol[0])) c = c.toUpperCase();
        commit += c; vol = vol.slice(k.length);
      } else { commit += vol[0]; vol = vol.slice(1); }
    }
    const newOut = translit(vol);
    ta.setRangeText(commit + newOut, volStart, volStart + volOut.length, 'end');
    volStart += commit.length;
    volOut = newOut;
    persistCurrent();   // setRangeText doesn't fire `input`, so save explicitly
  });

  // Context menu — acts on the selection, or on the whole note when nothing is selected.
  const ctxMenu = document.getElementById('ctxMenu');
  let menuRange = [0, 0], menuHasSel = false;
  let rightDownSel = null;

  // Right-click shouldn't move the caret, and macOS selects the word under the
  // pointer before `contextmenu` fires — so remember the selection and restore it.
  ta.addEventListener('mousedown', e => {
    if (e.button !== 2) return;
    e.preventDefault();
    rightDownSel = [ta.selectionStart, ta.selectionEnd];
  });
  ta.addEventListener('contextmenu', e => {
    e.preventDefault();
    ta.focus();
    if (rightDownSel){ ta.setSelectionRange(...rightDownSel); rightDownSel = null; }
    flushVol();
    const s = ta.selectionStart, en = ta.selectionEnd;
    menuHasSel = s !== en;
    menuRange = menuHasSel ? [s, en] : [0, ta.value.length];
    for (const b of ctxMenu.querySelectorAll('button')) b.disabled = menuRange[0] === menuRange[1];
    showMenu(e.clientX, e.clientY);
  });

  function showMenu(x, y){
    ctxMenu.hidden = false;
    const r = ctxMenu.getBoundingClientRect();
    ctxMenu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
    ctxMenu.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
  }
  function hideMenu(){ ctxMenu.hidden = true; }
  document.addEventListener('mousedown', e => { if (!ctxMenu.contains(e.target)) hideMenu(); });
  ta.addEventListener('scroll', hideMenu);
  window.addEventListener('resize', hideMenu);
  window.addEventListener('blur', hideMenu);

  ctxMenu.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the textarea
  ctxMenu.addEventListener('contextmenu', e => e.preventDefault());
  ctxMenu.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    hideMenu();
    const [s, en] = menuRange;
    if (b.dataset.act === 'copy') copyRange(s, en);
    else replaceRange(s, en, (b.dataset.act === 'cyr' ? translit : toLatin)(ta.value.slice(s, en)));
  });

  // Replace via insertText so the conversion can be undone with Cmd/Ctrl+Z.
  function replaceRange(s, en, text){
    if (text === ta.value.slice(s, en)) return;
    ta.setSelectionRange(s, en);
    replacing = true;
    const ok = document.execCommand('insertText', false, text);   // fires `input` → persisted
    replacing = false;
    if (!ok){ ta.setRangeText(text, s, en, 'end'); persistCurrent(); }
    if (menuHasSel) ta.setSelectionRange(s, s + text.length);
  }

  function copyRange(s, en){
    const text = ta.value.slice(s, en);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(flashCopied).catch(() => execCopy(s, en));
    } else {
      execCopy(s, en);
    }
  }
  function execCopy(s, en){
    const prev = [ta.selectionStart, ta.selectionEnd];
    ta.setSelectionRange(s, en);
    try { if (document.execCommand('copy')) flashCopied(); } catch (_){}
    ta.setSelectionRange(...prev);
  }
  function flashCopied(){
    modeLabel.textContent = T.copied;
    clearTimeout(flashCopied._t);
    flashCopied._t = setTimeout(renderMode, 900);
  }

  const renderMode = () => { modeLabel.textContent = cyrMode ? T.on : T.off; };
  function setMode(on){
    flushVol();                         // settle any in-progress run
    cyrMode = on;                       // only affects text typed from now on
    document.body.classList.toggle('cyr', on);
    renderMode();
    ta.focus();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      e.preventDefault();
      const dlg = document.querySelector('dialog[open]');
      if (dlg) dlg.close();             // Esc closes a dialog / the menu instead of toggling
      else if (!ctxMenu.hidden) hideMenu();
      else setMode(!cyrMode);
    } else hideMenu();                  // typing dismisses the menu
  });

  // Dialogs close on × or a backdrop click, then hand focus back to the editor.
  for (const dlg of document.querySelectorAll('dialog')){
    dlg.querySelector('.dlg-close').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   // backdrop
    dlg.addEventListener('close', () => ta.focus());
  }

  const escBtn = document.getElementById('escBtn');
  escBtn.addEventListener('mousedown', e => e.preventDefault());   // keep caret in the textarea
  escBtn.addEventListener('click', () => setMode(!cyrMode));

  // Help dialog — the table is built from KEYS so it always matches the map.
  const help = document.getElementById('help');
  const helpGrid = document.getElementById('helpGrid');
  function renderHelp(){
    helpGrid.innerHTML = KEYS.map(([, alts, cyr]) =>
      '<div class="help-row"><button type="button" class="help-cyr">' + cyr + '</button><span class="help-lat">' +
      alts.split(',').map(a => '<kbd>' + a + '</kbd>').join('') + '</span></div>'
    ).join('');
  }
  document.getElementById('helpBtn').addEventListener('click', () => help.showModal());

  // Clicking a letter inserts it at the caret; Shift inserts the capital.
  helpGrid.addEventListener('mousedown', e => { if (e.target.closest('.help-cyr')) e.preventDefault(); });
  helpGrid.addEventListener('click', e => {
    const b = e.target.closest('.help-cyr');
    if (!b) return;
    const c = e.shiftKey ? b.textContent.toUpperCase() : b.textContent;
    help.close();
    flushVol();
    ta.focus();
    ta.setRangeText(c, ta.selectionStart, ta.selectionEnd, 'end');
    persistCurrent();
  });
  // While Shift is held the table shows capitals.
  const setCaps = on => help.classList.toggle('caps', on);
  document.addEventListener('keydown', e => { if (e.key === 'Shift') setCaps(true); });
  document.addEventListener('keyup', e => { if (e.key === 'Shift') setCaps(false); });
  window.addEventListener('blur', () => setCaps(false));

  // Language — sets both the layout and the UI language. The choice is remembered
  // and shown in the address bar as ?lang=<code>.
  const langBtn = document.getElementById('langBtn');
  const langDlg = document.getElementById('langDlg');
  const langList = document.getElementById('langList');
  function setLang(l){
    flushVol();                         // settle any run typed under the old layout
    lang = l;
    T = I18N[l];
    buildMap();
    document.documentElement.lang = T.htmlLang;
    for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = T[el.dataset.i18n];
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = T[el.dataset.i18nTitle];
    langBtn.textContent = l.toUpperCase();
    renderMode();
    renderHelp();
    renderLangs();
    renderList();                       // note placeholders and dates are localized too
    try{ localStorage.setItem(LANG_STORE, l); }catch(_){}
  }
  function renderLangs(){
    langList.innerHTML = Object.keys(LAYOUTS).map(l =>
      '<button type="button" class="lang-opt" data-lang="' + l + '" aria-current="' + (l === lang) + '">' +
        '<span class="lang-code">' + l.toUpperCase() + '</span><span>' + I18N[l].name + '</span>' +
        (l === lang ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
      '</button>'
    ).join('');
  }
  langBtn.addEventListener('mousedown', e => e.preventDefault());   // keep caret in the textarea
  langBtn.addEventListener('click', () => langDlg.showModal());
  langList.addEventListener('click', e => {
    const b = e.target.closest('.lang-opt');
    if (!b) return;
    langDlg.close();
    if (b.dataset.lang === lang) return;
    setLang(b.dataset.lang);
    try{ history.pushState({ lang }, '', '?lang=' + lang); }catch(_){}
  });
  window.addEventListener('popstate', e => {
    const l = e.state?.lang ?? urlLang();
    if (isLang(l) && l !== lang) setLang(l);
  });

  // Theme — follows the system until picked with the button; the pick is remembered.
  // Picking the system's own theme forgets it, so the page follows the system again.
  const THEME_STORE = 'translit-theme';
  const themeBtn = document.getElementById('themeBtn');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const systemTheme = () => systemDark.matches ? 'dark' : 'light';
  function setTheme(t){
    document.documentElement.dataset.theme = t;
    themeBtn.setAttribute('aria-pressed', t === 'dark');
    themeMeta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  }
  themeBtn.addEventListener('mousedown', e => e.preventDefault());   // keep caret in the textarea
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    setTheme(t);
    try{
      if (t === systemTheme()) localStorage.removeItem(THEME_STORE);
      else localStorage.setItem(THEME_STORE, t);
    }catch(_){}
  });
  systemDark.addEventListener('change', () => {
    let saved = null;
    try{ saved = localStorage.getItem(THEME_STORE); }catch(_){}
    if (!saved) setTheme(systemTheme());
  });
  setTheme(document.documentElement.dataset.theme);   // sync the button with what the head script chose

  // Notes — persisted to localStorage as JSON.
  const STORE = 'translit-notes';
  const noteListEl = document.getElementById('noteList');
  let notes = [];
  let currentId = null;

  const blankNote = () => ({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    body: '',
    updated: Date.now()
  });
  const current = () => notes.find(n => n.id === currentId);

  function loadNotes(){
    try{
      const data = JSON.parse(localStorage.getItem(STORE));
      if (data && Array.isArray(data.notes)){ notes = data.notes; currentId = data.currentId; }
    }catch(_){}
    if (!notes.length){ const n = blankNote(); notes.push(n); currentId = n.id; }
    if (!notes.some(n => n.id === currentId)) currentId = notes[0].id;
  }
  function saveNotes(){
    localStorage.setItem(STORE, JSON.stringify({ notes, currentId }));
  }

  function previewOf(body){
    const t = body.replace(/^\s+/, '');
    const nl = t.indexOf('\n');
    const title = (nl === -1 ? t : t.slice(0, nl)).trim() || T.newNote;
    const rest = (nl === -1 ? '' : t.slice(nl + 1)).replace(/\s+/g, ' ').trim();
    return { title, snippet: rest || T.noText };
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString(T.htmlLang, { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString(T.htmlLang, { month: 'short', day: 'numeric' });
  }

  function renderList(){
    noteListEl.innerHTML = '';
    [...notes].sort((a, b) => b.updated - a.updated).forEach(n => {
      const { title, snippet } = previewOf(n.body);
      const item = document.createElement('div');
      item.className = 'note-item' + (n.id === currentId ? ' active' : '');
      item.innerHTML =
        '<div class="note-body">' +
          '<div class="note-title"></div><div class="note-date"></div><div class="note-snippet"></div>' +
        '</div>' +
        '<button class="note-del" title="' + T.deleteNote + '" aria-label="' + T.deleteNote + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="3 6 5 6 21 6"></polyline>' +
            '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>' +
            '<path d="M10 11v6M14 11v6"></path>' +
            '<path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>' +
          '</svg>' +
        '</button>';
      item.querySelector('.note-title').textContent = title;
      item.querySelector('.note-date').textContent = fmtDate(n.updated);
      item.querySelector('.note-snippet').textContent = snippet;
      item.querySelector('.note-body').addEventListener('click', () => selectNote(n.id));
      item.querySelector('.note-del').addEventListener('click', e => {
        e.stopPropagation();
        deleteNote(n.id);
      });
      noteListEl.appendChild(item);
    });
  }

  function selectNote(id){
    if (id === currentId) return;
    flushVol();
    currentId = id;
    ta.value = current().body;
    saveNotes();
    renderList();
    ta.focus();
  }
  function newNote(){
    flushVol();
    const n = blankNote();
    notes.push(n);
    currentId = n.id;
    ta.value = '';
    saveNotes();
    renderList();
    ta.focus();
  }
  function deleteNote(id){
    flushVol();
    notes = notes.filter(n => n.id !== id);
    if (!notes.length){ const n = blankNote(); notes.push(n); currentId = n.id; }
    if (!notes.some(n => n.id === currentId)){
      currentId = [...notes].sort((a, b) => b.updated - a.updated)[0].id;
    }
    ta.value = current().body;
    saveNotes();
    renderList();
    ta.focus();
  }
  document.getElementById('newNote').addEventListener('click', newNote);

  // Write the textarea's current contents into the active note and persist.
  function persistCurrent(){
    const n = current();
    if (!n) return;
    n.body = ta.value;
    n.updated = Date.now();
    saveNotes();
    renderList();
  }
  // Native edits (space, punctuation, delete, paste) fire `input`. Transliterated
  // letters go through setRangeText in `beforeinput`, which does NOT fire `input`,
  // so those are persisted explicitly there via persistCurrent().
  ta.addEventListener('input', persistCurrent);

  loadNotes();
  ta.value = current().body;
  setLang(lang);                        // applies the UI strings and renders the note list
  try{ history.replaceState({ lang }, ''); }catch(_){}   // lets Back/Forward restore the language
  ta.focus();
</script>
</body>
</html>
